<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name — Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="Stylesheet" href="Style.css">
</head>

<body>

    <div class="aurora">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="grain"></div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
        </svg>
    </button>

    <div class="wrap">

        <!-- ===== EDIT ME: profile photo ===== -->
        <!-- Replace the div below with: <div class="avatar"><img src="YOUR_PHOTO_URL_OR_FILE.jpg" alt="Your name"></div> -->
        <div class="avatar" id="avatar">YN</div>

        <div class="eyebrow">@yourhandle</div>
        <h1 class="name">Your Name</h1>
        <p class="bio">A short intro about who you are and what you do — swap this line for your own bio.</p>

        <!-- ===== EDIT ME: your links ===== -->
        <nav class="links" id="linkList">
            <!-- Portfolio -->
            <a class="link-btn" href="https://ettejahoquetech.vercel.app/" target="_blank" rel="noopener">
                <span class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16v16H4z" />
                        <path d="M4 9h16M9 21V9" />
                    </svg></span>
                <span class="link-label">Portfolio</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- Instagram -->
            <a class="link-btn" href="https://instagram.com" target="_blank" rel="noopener">
                <span class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" />
                        <circle cx="12" cy="12" r="4" />
                        <circle cx="17.5" cy="6.5" r="1" />
                    </svg></span>
                <span class="link-label">Instagram</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- LinkedIn -->
            <a class="link-btn" href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener">
                <span class="link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="3" />
                        <circle cx="8" cy="8" r="1" />
                        <path d="M8 11v6M12 17v-4a2 2 0 0 1 4 0v4M12 13v4" />
                    </svg>
                </span>
                <span class="link-label">LinkedIn</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- GitHub -->
            <a class="link-btn" href="https://github.com/yourusername" target="_blank" rel="noopener">
                <span class="link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21" />
                    </svg>
                </span>
                <span class="link-label">GitHub</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- Facebook -->
            <a class="link-btn" href="https://facebook.com/yourusername" target="_blank" rel="noopener">
                <span class="link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="4" />
                        <path d="M15 8h-2a2 2 0 0 0-2 2v2H9v3h2v6h3v-6h2.2l.8-3h-3V10a1 1 0 0 1 1-1h2z" />
                    </svg>
                </span>
                <span class="link-label">Facebook</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- Discord -->
            <a class="link-btn" href="https://discord.gg/yourinvite" target="_blank" rel="noopener">
                <span class="link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M8 9c1.5-.7 2.7-1 4-1s2.5.3 4 1" />
                        <path d="M6 8.5C4.5 11 4 13.5 4.5 17c1.5 1 3 1.6 4.5 2l.8-1.5" />
                        <path d="M18 8.5c1.5 2.5 2 5 1.5 8.5-1.5 1-3 1.6-4.5 2l-.8-1.5" />
                        <ellipse cx="9" cy="13" rx="1.1" ry="1.4" />
                        <ellipse cx="15" cy="13" rx="1.1" ry="1.4" />
                    </svg>
                </span>
                <span class="link-label">Discord</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- X / Twitter -->
            <a class="link-btn" href="https://x.com" target="_blank" rel="noopener">
                <span class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4l16 16M20 4L4 20" />
                    </svg></span>
                <span class="link-label">X / Twitter</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- LeetCode -->
            <a class="link-btn" href="https://leetcode.com/yourusername" target="_blank" rel="noopener">
                <span class="link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M13 3L5 12l8 9" />
                        <path d="M9 12h11" />
                        <path d="M14 8l4 4-4 4" />
                    </svg>
                </span>
                <span class="link-label">LeetCode</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- GeeksforGeeks -->
            <a class="link-btn" href="https://auth.geeksforgeeks.org/user/yourusername" target="_blank" rel="noopener">
                <span class="link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M9 9.5c0-1 .8-1.5 1.5-1.5S12 8.5 12 9.5" />
                        <path d="M15 9.5c0-1-.8-1.5-1.5-1.5S12 8.5 12 9.5" />
                        <path d="M8 14c1.2 1.3 2.6 2 4 2s2.8-.7 4-2" />
                    </svg>
                </span>
                <span class="link-label">GeeksforGeeks</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- HackerRank -->
            <a class="link-btn" href="https://hackerrank.com/yourusername" target="_blank" rel="noopener">
                <span class="link-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 2l8 4.5v11L12 22l-8-4.5v-11L12 2z" />
                        <path d="M9 8v8M15 8v8M9 12h6" />
                    </svg>
                </span>
                <span class="link-label">HackerRank</span>
                <span class="link-arrow">→</span>
            </a>
            <!-- Email -->
            <a class="link-btn" href="mailto:you@example.com">
                <span class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="3" />
                        <path d="M2 7l10 6 10-6" />
                    </svg></span>
                <span class="link-label">Email Me</span>
                <span class="link-arrow">→</span>
            </a>
        </nav>

        <button class="sound-toggle" id="soundToggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" id="soundIcon">
                <path d="M11 5L6 9H2v6h4l5 4V5z" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
            </svg>
            <span id="soundLabel">Sound on</span>
        </button>

        <div class="footer">
            <span class="dot"></span>
            <span>made with care</span>
        </div>

    </div>

    <script src="App.js"></script>

</body>

</html>
